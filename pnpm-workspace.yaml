# Échoue si le pnpm lancé ne correspond pas au champ packageManager de
# package.json (version épinglée + hash). npm/yarn sont bloqués par le
# script preinstall (scripts/enforce-pnpm.cjs).
pmOnFail: error

# Refuse une version de Node hors du champ engines de package.json.
engineStrict: true

# Cooldown anti supply-chain : refuse toute version publiée il y a moins de
# 7 jours (10080 min), le temps que l'écosystème repère un paquet compromis.
minimumReleaseAge: 10080

# Scripts d'installation (preinstall/postinstall…) des dépendances : aucun
# autorisé. Ajouter ici, un par un, les seuls paquets qui en ont besoin.
allowBuilds: {}

# Versions exactes dans package.json (pas de ^) : une mise à jour est toujours explicite.
savePrefix: ''

# Exceptions au cooldown (correctifs de sécurité) : jamais un paquet entier,
# toujours une version précise (`paquet@1.2.3`) dans minimumReleaseAgeExclude ;
# voir le skill `dependances-securite`. Le prune retire de la liste les
# exceptions devenues inutiles (version assez ancienne, ou plus utilisée).
minimumReleaseAgeExclude: []
minimumReleaseAgeExcludePrune: true

# `pnpm audit` échoue à partir de ce niveau de gravité.
audit:
  level: high
